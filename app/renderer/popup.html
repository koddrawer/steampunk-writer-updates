<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Steampunk Writer - Video</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app: media:; media-src app: media: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' app: 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  /* chừa viền 8px để kéo giãn cửa sổ, phần giữa dùng để kéo di chuyển */
  #drag { position: absolute; inset: 8px; -webkit-app-region: drag; }
  #bar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; opacity: 0; transition: opacity .2s; -webkit-app-region: no-drag; }
  body:hover #bar { opacity: 1; }
  #bar button { background: rgba(20,16,12,.8); color: #e8c98a; border: 1px solid #6b5332; border-radius: 6px; font: 600 12px system-ui; padding: 4px 8px; cursor: pointer; }
  #hint { position: absolute; left: 10px; bottom: 10px; color: #e8c98a99; font: 12px system-ui; opacity: 0; transition: opacity .2s; pointer-events: none; }
  body:hover #hint { opacity: 1; }
  body.edit { outline: 2px dashed #e8c98a; outline-offset: -2px; }
</style>
</head>
<body>
<video id="v" playsinline></video>
<div id="drag"></div>
<div id="bar"><button id="hide" title="Ẩn popup (mở lại ở bảng điều khiển)">Ẩn</button></div>
<div id="hint">Kéo để di chuyển · kéo mép để đổi kích thước</div>
<script src="./js/popup.js"></script>
</body>
</html>
